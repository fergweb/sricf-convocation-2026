<!-- 2026 Convocation schedule. Shows the live page from GitHub; updates appear on their own. -->
<iframe id="sricf-schedule" src="https://fergweb.github.io/sricf-convocation-2026/" title="2026 Convocation Schedule" style="display:block;width:100%;height:2600px;border:0;" scrolling="no"></iframe>
<script>
window.addEventListener('message', function (e) {
  if (e.origin !== 'https://fergweb.github.io' || !e.data) return;
  var frame = document.getElementById('sricf-schedule');
  if (e.data.type === 'sricf-schedule-height') {
    frame.style.height = e.data.height + 'px';
  }
  if (e.data.type === 'sricf-schedule-scroll') {
    var header = document.querySelector('.fusion-header');
    var offset = (header ? Math.min(header.offsetHeight, 140) : 0) + 16;
    var top = frame.getBoundingClientRect().top + window.pageYOffset + e.data.top - offset;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }
});
</script>
